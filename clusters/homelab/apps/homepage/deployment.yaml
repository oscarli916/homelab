apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      initContainers:
        - name: copy-config
          image: ghcr.io/gethomepage/homepage:v1.12.3
          command:
            - sh
            - -c
            - cp /tmp/config/* /app/config/
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: config-source
              mountPath: /tmp/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.12.3
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.home.arpa,homepage"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          emptyDir: {}
        - name: config-source
          configMap:
            name: homepage
