apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app.kubernetes.io/name: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      initContainers:
        - name: git-clone
          image: alpine/git:2.47.2
          command:
            - sh
            - -c
            - |
              mkdir -p /root/.ssh
              cp /etc/git-secret/ssh-privatekey /root/.ssh/id_ed25519
              chmod 600 /root/.ssh/id_ed25519
              ssh-keyscan -t ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null

              if [ -d /workspace/.git ] && [ ! -d /workspace/homelab/.git ]; then
                mkdir -p /workspace/homelab
                for path in /workspace/* /workspace/.[!.]* /workspace/..?*; do
                  [ -e "$path" ] || continue
                  [ "$path" = /workspace/homelab ] && continue
                  mv "$path" /workspace/homelab/
                done
                echo "Existing homelab repository moved to /workspace/homelab"
              fi

              if [ ! -d /workspace/homelab/.git ]; then
                git clone git@github.com:oscarli916/homelab.git /workspace/homelab
              else
                echo "Homelab repository already exists, skipping clone"
              fi

              if [ ! -d /workspace/lync-web/.git ]; then
                git clone git@github.com:oscarli916/lync-web.git /workspace/lync-web
              else
                echo "Lync Web repository already exists, skipping clone"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: git-ssh
              mountPath: /etc/git-secret
              readOnly: true
      containers:
        - name: opencode
          image: oscarli916/opencode-custom:1.14.33-pty
          args:
            - web
            - --hostname
            - "0.0.0.0"
            - --port
            - "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          workingDir: /workspace/homelab
          env:
            - name: OPENCODE_SERVER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: server-username
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: server-password
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: git-ssh
              mountPath: /root/.ssh/id_ed25519
              subPath: ssh-privatekey
              readOnly: true
            - name: opencode-data
              mountPath: /root/.config/opencode
              subPath: config
            - name: opencode-data
              mountPath: /root/.local/share/opencode
              subPath: share
            - name: opencode-data
              mountPath: /root/.local/state/opencode
              subPath: state
            - name: opencode-data
              mountPath: /root/.cache/opencode
              subPath: cache
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: git-ssh
          secret:
            secretName: opencode-secrets
            items:
              - key: ssh-privatekey
                path: ssh-privatekey
                mode: 0600
            defaultMode: 0600
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
