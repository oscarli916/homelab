apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-tailscale
  namespace: longhorn-system
spec:
  ingressClassName: tailscale
  rules:
  - host: longhorn                        # becomes longhorn.tail5e11fb.ts.net (or your renamed tailnet name)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
  tls:
  - hosts:
    - longhorn
