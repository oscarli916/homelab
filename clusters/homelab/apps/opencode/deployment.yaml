apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app.kubernetes.io/name: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      initContainers:
        - name: git-clone
          image: alpine/git:2.47.2
          command:
            - sh
            - -c
            - |
              if [ ! -d /workspace/.git ]; then
                mkdir -p /root/.ssh
                cp /etc/git-secret/ssh-privatekey /root/.ssh/id_ed25519
                chmod 600 /root/.ssh/id_ed25519
                ssh-keyscan -t ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null
                git clone git@github.com:oscarli916/homelab.git /workspace
                echo "Repository cloned successfully"
              else
                echo "Repository already exists, skipping clone"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: git-ssh
              mountPath: /etc/git-secret
              readOnly: true
      containers:
        - name: opencode
          image: ghcr.io/anomalyco/opencode:latest
          args:
            - web
            - --hostname
            - "0.0.0.0"
            - --port
            - "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          workingDir: /workspace
          env:
            - name: OPENCODE_SERVER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: server-username
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencode-secrets
                  key: server-password
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: git-ssh
              mountPath: /root/.ssh/id_ed25519
              subPath: ssh-privatekey
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: git-ssh
          secret:
            secretName: opencode-secrets
            items:
              - key: ssh-privatekey
                path: ssh-privatekey
                mode: 0600
            defaultMode: 0600
