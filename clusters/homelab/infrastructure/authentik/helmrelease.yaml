apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  timeout: 10m0s
  chart:
    spec:
      chart: authentik
      version: "2026.2.2"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  targetNamespace: authentik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    authentik:
      existingSecret:
        secretName: authentik-config
      postgresql:
        host: authentik-authentik-postgresql
      error_reporting:
        enabled: false
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: home-arpa-ca
        hosts:
          - authentik.home.arpa
        tls:
          - hosts:
              - authentik.home.arpa
            secretName: authentik-home-arpa-tls
    postgresql:
      enabled: true
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-postgresql
        secretKeys:
          adminPasswordKey: postgres-password
          userPasswordKey: password
      primary:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 2Gi
