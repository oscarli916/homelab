apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-home
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: home-arpa-ca
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grafana
    gethomepage.dev/description: Monitoring dashboards
    gethomepage.dev/group: Monitoring
    gethomepage.dev/icon: grafana
    gethomepage.dev/href: https://grafana.home.arpa
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-stack-grafana
                port:
                  number: 80
  tls:
    - hosts:
        - grafana.home.arpa
      secretName: grafana-home-arpa-tls
---
