apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode
  labels:
    app.kubernetes.io/name: opencode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode
    spec:
      initContainers:
        - name: git-clone
          image: alpine/git:2.47.2
          command:
            - sh
            - -c
            - |
              mkdir -p /root/.ssh
              cp /etc/git-secret/ssh-privatekey /root/.ssh/id_ed25519
              chmod 600 /root/.ssh/id_ed25519
              ssh-keyscan -t ed25519 github.com >> /root/.ssh/known_hosts 2>/dev/null

              if [ -d /workspace/.git ] && [ ! -d /workspace/homelab/.git ]; then
                mkdir -p /workspace/homelab
                for path in /workspace/* /workspace/.[!.]* /workspace/..?*; do
                  [ -e "$path" ] || continue
                  [ "$path" = /workspace/homelab ] && continue
                  mv "$path" /workspace/homelab/
                done
                echo "Existing homelab repository moved to /workspace/homelab"
              fi

              if [ ! -d /workspace/homelab/.git ]; then
                git clone git@github.com:oscarli916/homelab.git /workspace/homelab
              else
                echo "Homelab repository already exists, skipping clone"
              fi

              if [ ! -d /workspace/lync-web/.git ]; then
                git clone git@github.com:oscarli916/lync-web.git /workspace/lync-web
              else
                echo "Lync Web repository already exists, skipping clone"
              fi

              if [ ! -d /workspace/lync-auth/.git ]; then
                git clone git@github.com:oscarli916/lync-auth.git /workspace/lync-auth
              else
                echo "Lync Auth repository already exists, skipping clone"
              fi

              if [ ! -d /workspace/lync-transfer/.git ]; then
                git clone git@github.com:oscarli916/lync-transfer.git /workspace/lync-transfer
              else
                echo "Lync Transfer repository already exists, skipping clone"
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: git-ssh
              mountPath: /etc/git-secret
              readOnly: true
        - name: sync-opencode-config
          image: alpine/git:2.47.2
          env:
            - name: DOTFILES_REVISION
              value: "5415a3d85065a31c185f32d45c4f3b3517798184"
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/skills /config/commands
              # Optional config must not prevent the remote server from starting.
              if timeout 90 sh -ec '
                git init /config/repository
                git -C /config/repository config remote.origin.url https://github.com/oscarli916/dotfiles.git
                git -C /config/repository fetch --depth=1 origin "$DOTFILES_REVISION"
                git -C /config/repository checkout --detach "$DOTFILES_REVISION"
                test -d /config/repository/.config/opencode/skills
                test -d /config/repository/.config/opencode/commands
                cp -R /config/repository/.config/opencode/skills/. /config/skills/
                cp -R /config/repository/.config/opencode/commands/. /config/commands/
              '; then
                echo "Loaded OpenCode skills and commands from $DOTFILES_REVISION"
              else
                rm -rf /config/skills/* /config/skills/.[!.]* /config/skills/..?* /config/commands/* /config/commands/.[!.]* /config/commands/..?*
                echo "WARNING: Dotfiles sync failed; starting OpenCode without synced skills and commands" >&2
              fi
          volumeMounts:
            - name: opencode-dotfiles
              mountPath: /config
      containers:
        - name: opencode
          image: oscarli916/opencode-custom:1.14.33-pty-gh
          args:
            - web
            - --hostname
            - "0.0.0.0"
            - --port
            - "3000"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          workingDir: /workspace/homelab
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: git-ssh
              mountPath: /root/.ssh/id_ed25519
              subPath: ssh-privatekey
              readOnly: true
            - name: opencode-data
              mountPath: /root/.config/gh
              subPath: gh
            - name: opencode-data
              mountPath: /root/.config/opencode
              subPath: config
            - name: opencode-dotfiles
              mountPath: /root/.config/opencode/skills
              subPath: skills
              readOnly: true
            - name: opencode-dotfiles
              mountPath: /root/.config/opencode/commands
              subPath: commands
              readOnly: true
            - name: opencode-data
              mountPath: /root/.local/share/opencode
              subPath: share
            - name: opencode-data
              mountPath: /root/.local/state/opencode
              subPath: state
            - name: opencode-data
              mountPath: /root/.cache/opencode
              subPath: cache
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: opencode-dotfiles
          emptyDir: {}
        - name: workspace
          persistentVolumeClaim:
            claimName: opencode-workspace
        - name: git-ssh
          secret:
            secretName: opencode-secrets
            items:
              - key: ssh-privatekey
                path: ssh-privatekey
                mode: 0600
            defaultMode: 0600
        - name: opencode-data
          persistentVolumeClaim:
            claimName: opencode-data
