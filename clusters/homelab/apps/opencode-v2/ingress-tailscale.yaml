apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode-v2-tailscale
  namespace: opencode
spec:
  ingressClassName: tailscale
  rules:
    - host: opencode-v2
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencode-v2-web
                port:
                  number: 3000
  tls:
    - hosts:
        - opencode-v2
