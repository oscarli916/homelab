apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-home
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: home-arpa-ca
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Longhorn
    gethomepage.dev/description: Distributed storage
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: longhorn
    gethomepage.dev/href: https://longhorn.home.arpa
spec:
  ingressClassName: traefik
  rules:
    - host: longhorn.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - longhorn.home.arpa
      secretName: longhorn-home-arpa-tls
