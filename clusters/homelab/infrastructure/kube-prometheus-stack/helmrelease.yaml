apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "84.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  targetNamespace: monitoring
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    grafana:
      deploymentStrategy:
        type: Recreate
      extraConfigmapMounts:
        - name: home-arpa-ca
          mountPath: /etc/ssl/certs/home-arpa-ca.crt
          subPath: ca.crt
          configMap: home-arpa-ca
          readOnly: true
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
          secretKeyRef:
            name: grafana-oauth-secret
            key: client-id
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oauth-secret
            key: client-secret
      grafana.ini:
        server:
          root_url: https://grafana.home.arpa
        auth.generic_oauth:
          enabled: true
          name: Authentik
          allow_sign_up: true
          tls_client_ca: /etc/ssl/certs/home-arpa-ca.crt
          client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
          client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
          scopes: openid profile email
          auth_url: https://authentik.home.arpa/application/o/authorize/
          token_url: https://authentik.home.arpa/application/o/token/
          api_url: https://authentik.home.arpa/application/o/userinfo
          email_attribute_path: email
          signout_redirect_url: https://authentik.home.arpa/application/o/grafana/end-session/
          role_attribute_path: contains(groups[*], 'admin') && 'Admin' || 'Viewer'
          allow_assign_grafana_admin: true
          auto_login: false
      persistence:
        enabled: true
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      ingress:
        enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        retention: 15d
        retentionSize: 16GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      ingress:
        enabled: false
      alertmanagerSpec:
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: kube-prometheus-stack
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
